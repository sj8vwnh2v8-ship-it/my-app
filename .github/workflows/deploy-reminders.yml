# Installs the reminder service (the worker/ folder) on Cloudflare
# whenever it changes. Needs the CLOUDFLARE_API_TOKEN repository secret.
name: Deploy reminder service

on:
  push:
    branches: [claude/todo-app, main]
    paths: ['worker/**', '.github/workflows/deploy-reminders.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare key
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "The CLOUDFLARE_API_TOKEN secret hasn't been added yet, so there's nothing to deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm ci

      - name: Test
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm test

      - name: Deploy to Cloudflare
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Remove any spaces or line breaks picked up while copying the key.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN
          ACCOUNT_ID="$(printf '%s' "$ACCOUNT_ID" | tr -d '[:space:]')"
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if [ -z "$ACCOUNT_ID" ]; then
            ACCOUNT_ID="$(curl -fsS -H "$AUTH" "$API/accounts" | jq -r '.result[0].id')"
          fi
          export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
          # The service needs a free workers.dev web address. Pick one if there isn't one yet.
          SUB="$(curl -sS -H "$AUTH" "$API/accounts/$ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')"
          if [ -z "$SUB" ]; then
            NAME="ember-${ACCOUNT_ID:0:6}"
            echo "Registering the workers.dev name: $NAME"
            curl -fsS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$NAME\"}" "$API/accounts/$ACCOUNT_ID/workers/subdomain" | jq -c '.success, .errors'
            SUB="$NAME"
          fi
          echo "workers.dev name: $SUB"
          npx wrangler deploy
